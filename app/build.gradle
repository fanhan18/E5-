plugins {
  id 'com.android.application'
}
android {
  namespace 'com.operit.printhelper'
  compileSdk 34
  defaultConfig {
    applicationId 'com.operit.printhelper'
    minSdk 28
    targetSdk 34
    versionCode 4
    versionName "0.4"
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
    debug {
      debuggable true
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
dependencies {
}
