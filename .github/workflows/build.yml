name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: "Unpack project and detect toolchain"
        id: unpack
        run: |
          set -euo pipefail
          if [ -f project.zip ]; then
            unzip -o project.zip -d /tmp/project
            ROOT_DIR="$(dirname "$(find /tmp/project -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1 || true)")"
            if [ -z "${ROOT_DIR:-}" ]; then
              echo "No settings.gradle(.kts) found in project.zip"; exit 1
            fi
            echo "Detected project root: $ROOT_DIR"
            rsync -a --delete --exclude '.git' --exclude '.github' "$ROOT_DIR/". ./
          fi
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle missing at repo root"; exit 1
          fi
          GRADLE_VER=""
          GW_PROPS="$(find . -name gradle-wrapper.properties -type f | head -n1 || true)"
          if [ -n "${GW_PROPS:-}" ]; then
            DIST="$(grep -o 'gradle-[0-9][0-9.]*-[a-z]*\.zip' "$GW_PROPS" | head -n1 || true)"
            if [ -n "${DIST:-}" ]; then
              GRADLE_VER="$(echo "$DIST" | sed -E 's/^gradle-([0-9.]+)-.*\.zip$/\1/')"
            fi
          fi
          AGP_FULL="$(grep -Rho --include='*.gradle' --include='*.gradle.kts' --include='*.toml' -E 'com.android.tools.build:gradle:[0-9]+(\.[0-9]+)*' . | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n1 || true)"
          if [ -z "${AGP_FULL:-}" ]; then
            AGP_FULL="$(grep -Rho --include='*.gradle' --include='*.gradle.kts' -E "com.android.application[\"')]* +version +[\"']?[0-9]+(\.[0-9]+)*" . | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n1 || true)"
          fi
          if [ -z "${AGP_FULL:-}" ]; then
            AGP_FULL="$(grep -Rho --include='*.toml' -E "agp *= *[\"']?[0-9]+(\.[0-9]+)*" . | head -n1 | grep -oE '[0-9]+(\.[0-9]+)+' | head -n1 || true)"
          fi
          echo "Detected AGP: ${AGP_FULL:-none}"
          AGP_MAJOR="${AGP_FULL%%.*}"
          if [ -z "${AGP_MAJOR:-}" ]; then AGP_MAJOR=8; fi
          case "$AGP_MAJOR" in
            9) JAVA_VER=17; DEFAULT_GRADLE=9.0.0 ;;
            8) JAVA_VER=17; DEFAULT_GRADLE=8.14.3 ;;
            7) JAVA_VER=11; DEFAULT_GRADLE=7.6.4 ;;
            *) JAVA_VER=17; DEFAULT_GRADLE=8.14.3 ;;
          esac
          if [ -z "${GRADLE_VER:-}" ]; then GRADLE_VER="$DEFAULT_GRADLE"; fi
          echo "JAVA_VER=$JAVA_VER" | tee -a "$GITHUB_ENV"
          echo "GRADLE_VER=$GRADLE_VER" | tee -a "$GITHUB_ENV"
          echo "Toolchain: JDK $JAVA_VER, Gradle $GRADLE_VER"
          echo "java_ver=$JAVA_VER" >> "$GITHUB_OUTPUT"
          echo "gradle_ver=$GRADLE_VER" >> "$GITHUB_OUTPUT"
      - name: "Setup Java 17 (required by sdkmanager)"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: "Prepare Android cmdline-tools"
        run: |
          set -euo pipefail
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          else
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: "Accept Android SDK licenses (non-fatal)"
        run: |
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: "Detect compileSdk and install SDK packages"
        run: |
          set -euo pipefail
          COMPILE_SDK="$(grep -Rho --include='*.gradle*' '\bcompileSdk\s*=\s*[0-9]+' . | tail -n1 | awk -F= '{print $2}' | tr -d ' ' || true)"
          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="$(grep -Rho --include='*.gradle*' '\bcompileSdkVersion\s*[0-9]+' . | tail -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
          fi
          [ -n "$COMPILE_SDK" ] || COMPILE_SDK=34
          echo "COMPILE_SDK=$COMPILE_SDK" | tee -a "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;34.0.0"
      - name: "Setup project JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.unpack.outputs.java_ver }}
      - name: "Ensure Gradle (wrapper or download)"
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -x ./gradlew ]; then
            echo "Using project gradlew wrapper"
            echo "GRADLE_CMD=./gradlew" | tee -a "$GITHUB_ENV"
          else
            echo "gradlew missing; downloading Gradle ${GRADLE_VER}"
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
            unzip -q /tmp/gradle.zip -d "$HOME"
            echo "$HOME/gradle-${GRADLE_VER}/bin" | tee -a "$GITHUB_PATH"
            echo "GRADLE_CMD=gradle" | tee -a "$GITHUB_ENV"
          fi
      - name: "Detect application module"
        id: detect
        run: |
          set -euo pipefail
          FILE=$(grep -RIl --include='build.gradle' --include='build.gradle.kts' 'com.android.application' . | head -n1 || true)
          if [ -z "${FILE:-}" ]; then
            echo "No module applies com.android.application (only library? then no APK)"; exit 1
          fi
          APP_DIR="$(dirname "$FILE")"
          if [ "$APP_DIR" = "." ]; then
            MODULE=":"
          else
            MODULE=":${APP_DIR#./}"
          fi
          echo "APP_DIR=$APP_DIR" | tee -a "$GITHUB_ENV"
          echo "MODULE=$MODULE" | tee -a "$GITHUB_ENV"
          echo "Detected module: $MODULE (dir: $APP_DIR)"
      - name: "Build (try release then fallback to debug)"
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/gradle_build.log"
          : > "$LOG"
          "$GRADLE_CMD" --version >> "$LOG" 2>&1 || true
          head -n 6 "$LOG"
          if "$GRADLE_CMD" --no-daemon -x lint -x test "$MODULE:assembleRelease" >> "$LOG" 2>&1; then
            VARIANT=release
          else
            echo "assembleRelease failed; trying assembleDebug" | tee -a "$LOG"
            if "$GRADLE_CMD" --no-daemon -x lint -x test "$MODULE:assembleDebug" >> "$LOG" 2>&1; then
              VARIANT=debug
            else
              echo "=== BOTH ASSEMBLE FAILED ===" | tee -a "$LOG"
              echo "==================== GRADLE ERROR SUMMARY ===================="
              grep -nE -m 60 'What went wrong|Could not (resolve|download|get)|Unsupported|requires Gradle|Execution failed|AAPT2|Caused by|error: ' "$LOG" || echo "(no keyword matched)"
              echo "==================== LAST 50 LINES ===================="
              tail -n 50 "$LOG"
              exit 1
            fi
          fi
          echo "VARIANT=$VARIANT" | tee -a "$GITHUB_ENV"
          echo "Built variant: $VARIANT"
      - name: "Upload build log (always)"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
      - name: "Guard: fail if APK too small"
        run: |
          set -euo pipefail
          APK=$(ls -1 "$APP_DIR/build/outputs/apk/$VARIANT/"*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced under $APP_DIR/build/outputs/apk/$VARIANT"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "APK size: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "APK too small"; exit 1
          fi
      - name: "Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4-${{ env.VARIANT }}
          path: ${{ env.APP_DIR }}/build/outputs/apk/${{ env.VARIANT }}/*.apk
      - name: "Create GitHub Release (only when release built)"
        if: ${{ env.VARIANT == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto ${{ github.run_number }}
          tag_name: v0.4-${{ github.run_number }}
          files: ${{ env.APP_DIR }}/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
