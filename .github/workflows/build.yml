
name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      API_LEVEL: 34
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Accept Android SDK licenses
        run: |
          yes | "ANDROID_(S)DK_(R)OOT/cmdline − tools/latest/bin/sdkmanager" − − licenses − name:InstallAndroidSDKpackagesrun:∣"ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-API_(L)EVEL""build − tools;{BUILD_TOOLS}"
      - name: Build with Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4
          path: app/build/outputs/apk/release/.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto github.run_(n)umbertag_(n)ame:v0.4 −{{ github.run_number }}
          files: app/build/outputs/apk/release/.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
