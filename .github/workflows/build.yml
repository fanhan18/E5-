name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      API_LEVEL: 34
      BUILD_TOOLS: 34.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project to repo root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project.zip ]; then
            unzip -o project.zip -d /tmp/project
            ROOT_DIR="$(dirname "$(find /tmp/project -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1 || true)")"
            if [ -z "${ROOT_DIR:-}" ]; then
              echo "No settings.gradle(.kts) found in project.zip"; exit 1
            fi
            echo "Detected project root: $ROOT_DIR"
            rsync -a --delete --exclude '.git' --exclude '.github' "$ROOT_DIR/". ./
            ls -la
          fi
          test -f settings.gradle -o -f settings.gradle.kts || (echo "settings.gradle missing at repo root"; exit 1)
          test -f app/build.gradle -o -f app/build.gradle.kts || (echo "app/build.gradle missing"; exit 1)

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android cmdline-tools
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R $USER:$USER "$ANDROID_SDK_ROOT"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          else
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}"

      - name: Build with Gradle 8.7 (release)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleRelease

      - name: Guard: fail if APK too small
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)
          [ -n "$APK" ] || (echo "No release APK produced"; exit 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE"
          [ "$SIZE" -ge 1000000 ] || (echo "APK too small"; exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto ${{ github.run_number }}
          tag_name: v0.4-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
