
name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project.zip if exists
        run: |
          set -euo pipefail
          if [ -f project.zip ]; then
            unzip -o project.zip -d /tmp/project
            ROOT_DIR="$(dirname "$(find /tmp/project -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1 || true)")"
            if [ -z "${ROOT_DIR:-}" ]; then
              echo "No settings.gradle(.kts) found in project.zip"; exit 1
            fi
            echo "Detected project root: $ROOT_DIR"
            rsync -a --delete --exclude '.git' --exclude '.github' "$ROOT_DIR/". ./
          fi
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle missing at repo root"; exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android cmdline-tools
        run: |
          set -euo pipefail
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          else
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android SDK licenses (non-fatal)
        run: |
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Detect compileSdk/buildTools and install
        run: |
          set -euo pipefail
          # Detect compileSdk
          COMPILE_SDK="$(grep -Rho --include='*.gradle*' '\bcompileSdk\s*=\s*[0-9]+' . | tail -n1 | awk -F= '{print $2}' | tr -d ' ' || true)"
          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="$(grep -Rho --include='*.gradle*' '\bcompileSdkVersion\s*[0-9]+' . | tail -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || true)"
          fi
          [ -n "$COMPILE_SDK" ] || COMPILE_SDK=34

          # Detect buildToolsVersion
          BUILD_TOOLS="$(grep -Rho --include='*.gradle*' 'buildToolsVersion\\s*[\"'\\''][0-9.]+[\"'\\'']' . | tail -n1 | sed -E 's/.*[\"'\\'']([0-9.]+)[\"'\\''].*/\1/' || true)"
          if [ -z "$BUILD_TOOLS" ]; then BUILD_TOOLS="34.0.0"; fi

          echo "COMPILE_SDK=$COMPILE_SDK" | tee -a "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS" | tee -a "$GITHUB_ENV"

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Detect application module
        id: detect
        run: |
          set -euo pipefail
          FILE=$(grep -RIl --include='build.gradle' --include='build.gradle.kts' 'com.android.application' . | head -n1 || true)
          if [ -z "${FILE:-}" ]; then
            echo "No module applies com.android.application (only library? then no APK)"; exit 1
          fi
          APP_DIR="$(dirname "$FILE")"
          MODULE=":${APP_DIR#./}"
          MODULE="${MODULE//\//:}"
          echo "APP_DIR=$APP_DIR" | tee -a "$GITHUB_ENV"
          echo "MODULE=$MODULE" | tee -a "$GITHUB_ENV"
          echo "Detected module: $MODULE (dir: $APP_DIR)"

      - name: Build (try release then fallback to debug)
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --no-daemon "$MODULE:clean"
          if ./gradlew --no-daemon -x lint -x test "$MODULE:assembleRelease"; then
            VARIANT=release
          else
            echo "assembleRelease failed; trying assembleDebug"
            ./gradlew --no-daemon -x lint -x test "$MODULE:assembleDebug"
            VARIANT=debug
          fi
          echo "VARIANT=$VARIANT" | tee -a "$GITHUB_ENV"
          echo "Built variant: $VARIANT"

      - name: Guard: fail if APK too small
        run: |
          set -euo pipefail
          APK=$(ls -1 "$APP_DIR/build/outputs/apk/$VARIANT/"*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced under $APP_DIR/build/outputs/apk/$VARIANT"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "APK size: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "APK too small"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4-${{ env.VARIANT }}
          path: ${{ env.APP_DIR }}/build/outputs/apk/${{ env.VARIANT }}/*.apk

      - name: Create GitHub Release (only when release built)
        if: ${{ env.VARIANT == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto ${{ github.run_number }}
          tag_name: v0.4-${{ github.run_number }}
          files: ${{ env.APP_DIR }}/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
