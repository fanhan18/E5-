name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project from zip if present
        run: |
          if [ -f PantumHelper_0.4_src.zip ]; then
            unzip -o PantumHelper_0.4_src.zip -d extracted
            rsync -a extracted/project/ ./
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Build with Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleRelease
          gradle-version: 8.7
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4
          path: app/build/outputs/apk/release/*.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto ${{ github.run_number }}
          tag_name: v0.4-${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
