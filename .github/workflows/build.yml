name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      API_LEVEL: 34
      BUILD_TOOLS: 34.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project.zip if exists
        run: |
          set -euo pipefail
          if [ -f project.zip ]; then
            unzip -o project.zip -d /tmp/project
            ROOT_DIR="$(dirname "$(find /tmp/project -maxdepth 5 -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n1 || true)")"
            if [ -z "${ROOT_DIR:-}" ]; then
              echo "No settings.gradle(.kts) found in project.zip"; exit 1
            fi
            rsync -a --delete --exclude '.git' --exclude '.github' "$ROOT_DIR/". ./
          fi
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle missing at repo root"; exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R "$USER:$USER" "$ANDROID_SDK_ROOT"
          curl -sSL -o /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o /tmp/cli.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          else
            mv "$ANDROID_SDK_ROOT/cmdline-tools/tmp" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}"

      - name: Detect app module
        id: detect
        run: |
          set -euo pipefail
          FILE=$(grep -RIl --include='build.gradle' --include='build.gradle.kts' 'com.android.application' . | head -n1 || true)
          if [ -z "${FILE:-}" ]; then
            echo "No module applies com.android.application"; exit 1
          fi
          APP_DIR="$(dirname "$FILE")"
          MODULE=":${APP_DIR#./}"
          MODULE="${MODULE//\//:}"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Build (release then fallback to debug)
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --no-daemon "$MODULE:clean"
          if ./gradlew --no-daemon -x lint -x test "$MODULE:assembleRelease"; then
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "assembleRelease failed; building debug"
            ./gradlew --no-daemon -x lint -x test "$MODULE:assembleDebug"
            echo "VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(ls -1 "$APP_DIR/build/outputs/apk/$VARIANT/"*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced under $APP_DIR/build/outputs/apk/$VARIANT"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK"
          echo "Size: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "APK too small"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantumHelper-0.4-${{ env.VARIANT }}
          path: ${{ env.APP_DIR }}/build/outputs/apk/${{ env.VARIANT }}/*.apk

      - name: Create GitHub Release (only for release variant)
        if: ${{ env.VARIANT == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          name: PantumHelper 0.4 auto ${{ github.run_number }}
          tag_name: v0.4-${{ github.run_number }}
          files: ${{ env.APP_DIR }}/build/outputs/apk/release/*.apk
